apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-server
  template:
    metadata:
      labels:
        app: triton-server
    spec:
      containers:
        - name: triton-server
          image: nvcr.io/nvidia/tritonserver:23.08-py3
          args: ["tritonserver", "--model-repository=/models"]
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "8Gi"
              cpu: "4"
            requests:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: model-repository
              mountPath: /models
      volumes:
        - name: model-repository
          persistentVolumeClaim:
            claimName: triton-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: triton-server
spec:
  ports:
    - port: 8000
      name: http
    - port: 8001
      name: grpc
    - port: 8002
      name: metrics
  selector:
    app: triton-server
---
